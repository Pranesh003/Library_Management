<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Add Book</title>
</head>
<body>
	<form method="post" action="MainServlet">
		<h1>Add a Book</h1>
		<label>ISBN Number: <input type="text" name="isbn" required></label><br><br>
		<label>Book Name: <input type="text" name="bookName" required></label><br><br>
		<label>Book Type:
			<select name="bookType">
				<option value="G">General</option>
				<option value="T">Technical</option>
			</select>
		</label><br><br>
		<label>Author Name:
			<select name="authorName">
				<option value="Ramesh">Ramesh</option>
				<option value="Raju">Raju</option>
				<option value="Kumar">Kumar</option>
			</select>
		</label><br><br>
		<label>Book Cost: <input type="number" name="cost" min="1" step="0.01" required></label><br><br>
		<input type="submit" value="AddBook" name="operation">
	</form>
</body>
</html>
